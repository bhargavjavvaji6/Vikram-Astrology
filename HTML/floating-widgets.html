<!-- ========================================================
     FLOATING WIDGETS: WhatsApp Button + AI Chatbot
     Injected into every page via Footer.html
     ======================================================== -->
<style>
/* ============ WHATSAPP FLOAT BUTTON ============ */
.wa-float-btn {
    position: fixed;
    bottom: 30px;
    right: 28px;
    z-index: 9990;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25d366 0%, #128c3f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(37,211,102,0.45);
    cursor: pointer;
    text-decoration: none;
    animation: wa-float 2.8s ease-in-out infinite;
    transition: transform 0.2s, box-shadow 0.2s;
}
.wa-float-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 10px 28px rgba(37,211,102,0.6);
    animation-play-state: paused;
}
.wa-float-btn svg { width: 32px; height: 32px; fill: #fff; }

/* Pulse ring */
.wa-float-btn::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(37,211,102,0.5);
    animation: wa-pulse 2.8s ease-in-out infinite;
}

/* Floating bob animation */
@keyframes wa-float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
}
@keyframes wa-pulse {
    0%,100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.18); opacity: 0; }
}

/* Tooltip label */
.wa-float-btn .wa-tooltip {
    position: absolute;
    right: 68px;
    top: 50%;
    transform: translateY(-50%);
    background: #fff;
    color: #128c3f;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}
.wa-float-btn:hover .wa-tooltip { opacity: 1; }

/* ============ CHATBOT ============ */
/* Toggle button (bottom-right, above WhatsApp) */
.chatbot-toggle {
    position: fixed;
    bottom: 105px;
    right: 28px;
    z-index: 9990;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7a00 0%, #c85000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,122,0,0.45);
    border: none;
    transition: transform 0.2s, box-shadow 0.2s;
}
.chatbot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 28px rgba(255,122,0,0.6);
}
.chatbot-toggle svg { width: 26px; height: 26px; fill: #fff; }

/* Chatbot window */
.chatbot-window {
    position: fixed;
    bottom: 175px;
    right: 20px;
    z-index: 9989;
    width: 340px;
    max-width: calc(100vw - 30px);
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.85) translateY(20px);
    transform-origin: bottom right;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
}
.chatbot-window.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
}

/* Header bar */
.chatbot-header {
    background: linear-gradient(135deg, #092033, #1a4060);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.chatbot-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #ff7a00;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
}
.chatbot-header-info h4 { margin: 0; color: #fff; font-size: 15px; font-weight: 700; }
.chatbot-header-info p  { margin: 0; color: #a8cfe0; font-size: 12px; }
.chatbot-header-actions { margin-left: auto; display: flex; gap: 8px; }
.chatbot-header-actions button {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.6); font-size: 18px;
    padding: 2px 6px; border-radius: 4px;
    transition: color 0.2s, background 0.2s;
}
.chatbot-header-actions button:hover { color: #fff; background: rgba(255,255,255,0.1); }

/* Messages area */
.chatbot-messages {
    flex: 1;
    min-height: 200px;
    max-height: 300px;
    overflow-y: auto;
    padding: 18px 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f9fc;
}
.chatbot-messages::-webkit-scrollbar { width: 4px; }
.chatbot-messages::-webkit-scrollbar-thumb { background: #d0dde8; border-radius: 4px; }

/* Bot message bubble */
.chatbot-msg-bot {
    display: flex; gap: 10px; align-items: flex-start;
}
.chatbot-msg-bot .cb-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #092033; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 16px;
}
.chatbot-msg-bot .cb-bubble {
    background: #fff;
    border: 1px solid #e4ebf2;
    border-radius: 0 14px 14px 14px;
    padding: 12px 14px;
    font-size: 14px; color: #333;
    line-height: 1.5;
    max-width: 240px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* User message bubble */
.chatbot-msg-user {
    display: flex; justify-content: flex-end;
}
.chatbot-msg-user .cb-bubble {
    background: linear-gradient(135deg, #ff7a00, #e05a00);
    border-radius: 14px 14px 0 14px;
    padding: 10px 14px;
    font-size: 14px; color: #fff;
    max-width: 220px; line-height: 1.5;
}

/* Quick replies */
.chatbot-quick-replies {
    display: flex; flex-direction: column; gap: 8px; margin-top: 4px;
}
.chatbot-qr-btn {
    background: #fff; border: 1.5px solid #d0dce8;
    border-radius: 22px; padding: 9px 16px;
    font-size: 13px; color: #1a4060; cursor: pointer;
    text-align: left; transition: all 0.2s; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
}
.chatbot-qr-btn::before { content: '○'; color: #d0dce8; font-size: 11px; }
.chatbot-qr-btn:hover {
    background: #fff4eb; border-color: #ff7a00; color: #ff7a00;
}
.chatbot-qr-btn:hover::before { color: #ff7a00; content: '●'; }

/* Timestamp */
.chatbot-timestamp {
    font-size: 11px; color: #9aacbe; margin-top: 4px;
}

/* Input bar */
.chatbot-input-bar {
    padding: 12px 14px;
    border-top: 1px solid #e8eff6;
    display: flex; align-items: center; gap: 8px;
    background: #fff;
}
.chatbot-input-bar input {
    flex: 1; border: 1.5px solid #dce6f0; border-radius: 22px;
    padding: 9px 15px; font-size: 14px; outline: none;
    transition: border-color 0.2s;
}
.chatbot-input-bar input:focus { border-color: #ff7a00; }
.chatbot-input-bar input::placeholder { color: #aab8c8; }
.chatbot-send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: #ff7a00; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
}
.chatbot-send-btn:hover { background: #e05a00; transform: scale(1.08); }
.chatbot-send-btn svg { width: 17px; height: 17px; fill: #fff; }

/* Powered by */
.chatbot-footer {
    text-align: center; padding: 6px; font-size: 11px; color: #9aacbe;
    background: #f7f9fc; border-top: 1px solid #e8eff6;
}

/* ---- Mobile adjustments ---- */
@media (max-width: 480px) {
    .chatbot-window { right: 10px; bottom: 165px; width: calc(100vw - 20px); }
    .wa-float-btn   { bottom: 20px; right: 18px; }
    .chatbot-toggle { bottom: 90px; right: 18px; }
}
</style>

<!-- Chatbot Toggle Button -->
<button class="chatbot-toggle" id="chatbotToggle" aria-label="Open chat assistant" aria-expanded="false">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M256 32C114.6 32 0 125.1 0 240c0 49.6 21.4 95 57 130.7C44.5 421.1 2.7 466 2.2 466.5c-2.2 2.4-2.8 5.9-1.5 8.9S4.8 480 8 480c66.3 0 116-31.8 140.6-51.4C169.1 433.1 212.2 448 256 448c141.4 0 256-93.1 256-208S397.4 32 256 32zm0 368c-39.4 0-78.2-9.6-112.2-27.8l-15.8-8.7-17.7 13.4C90.3 394.3 60.5 411.2 25.8 416.3c11.6-18 21.8-37.6 29.8-57.9l6.6-17-12.4-12.8C27.7 305.8 16 273.3 16 240c0-105.9 107.4-192 240-192s240 86.1 240 192-107.4 192-240 192z"/>

<!-- Chatbot Window -->
<div class="chatbot-window" id="chatbotWindow" role="dialog" aria-label="Vikram Astrology Chat Assistant">
    <div class="chatbot-header">
        <div class="chatbot-avatar">🔮</div>
        <div class="chatbot-header-info">
            <h4>Vikram Astrologer</h4>
            <p>● Online &nbsp;·&nbsp; Typically replies instantly</p>
        </div>
        <div class="chatbot-header-actions">
            <button id="chatbotRefresh" aria-label="Reset chat" title="Restart">↺</button>
            <button id="chatbotClose"   aria-label="Close chat" title="Close">✕</button>
        </div>
    </div>
    <div class="chatbot-messages" id="chatbotMessages">
        <!-- Initial greeting injected by JS -->
    </div>
    <div class="chatbot-input-bar">
        <input type="text" id="chatbotInput" placeholder="Type your message..." autocomplete="off" aria-label="Chat input">
        <button class="chatbot-send-btn" id="chatbotSend" aria-label="Send message">
            <svg viewBox="0 0 512 512"><path d="M476.6 227.4L49.6 7.9C40.4 3.3 29.7 4.3 21.6 10.5S10 27.6 12.5 37.5L64 224H288c8.8 0 16 7.2 16 16s-7.2 16-16 16H64L12.5 474.5c-2.5 9.9 1 20.2 9.1 26.4s18.8 7.2 28 2.6l427-219.5c9.2-4.7 14.4-14.3 14.4-24.5s-5.2-19.7-14.4-24.6z"/></svg>
        </button>
    </div>
    <div class="chatbot-footer">Powered by ⚡ Vikram Astrology AI</div>
</div>

<script>
(function initChatbot() {
    const toggle   = document.getElementById('chatbotToggle');
    const window_  = document.getElementById('chatbotWindow');
    const closeBtn = document.getElementById('chatbotClose');
    const refreshBtn=document.getElementById('chatbotRefresh');
    const msgArea  = document.getElementById('chatbotMessages');
    const input    = document.getElementById('chatbotInput');
    const sendBtn  = document.getElementById('chatbotSend');

    // ---- Knowledge base ----
    const KB = {
        'psychic reading':   'We offer Online Psychic Readings via call, chat, or video. Book a session at <a href="appointment.html" style="color:#ff7a00">Appointment</a>.',
        'love':              'Vikram provides expert Love & Relationship readings. Understanding your cosmic compatibility can illuminate your path. Book a session today!',
        'career':            'Career & Finance astrology readings reveal the best timings and paths for your professional growth. Book now!',
        'horoscope':         'We cover all 12 zodiac signs. Visit our <a href="service.html" style="color:#ff7a00">Services</a> page or ask about your specific sign!',
        'contact':           'Call us: <a href="tel:+19295869234" style="color:#ff7a00">+1 929-586-9234</a> or email: vikrampsychic78@gmail.com.',
        'appointment':       'You can book an appointment <a href="appointment.html" style="color:#ff7a00">here</a>. We\'re available 7 days a week!',
        'black magic':       'Our Black Magic Removal & Protection services cleanse negative energies. <a href="service.html" style="color:#ff7a00">Learn more →</a>',
        'voodoo':            'Voodoo Priest services are available. See our <a href="service.html" style="color:#ff7a00">Services page</a> for details.',
        'vedic':             'We offer authentic Vedic Astrology readings rooted in ancient Indian traditions. <a href="service.html" style="color:#ff7a00">Learn more →</a>',
        'price':             'Pricing varies by service type. Please <a href="contact.html" style="color:#ff7a00">contact us</a> or book a free consultation!',
        'location':          'We serve clients worldwide. Our office: 119-10 101st Ave, South Richmond Hill, NY 11419.',
        'hello':             'Hello! 👋 I\'m Vikram\'s virtual assistant. How can I help you today?',
        'hi':                'Hi there! 🌟 How can I assist you with astrology or psychic services today?',
        'thank':             'You\'re welcome! ✨ Feel free to ask anything else. I\'m here to help!',
        'spiritual':         'Our spiritual healing sessions help restore balance and inner peace. <a href="service.html" style="color:#ff7a00">Book a session →</a>',
    };

    const QUICK_REPLIES = [
        { label: 'Psychic Reading', key: 'psychic reading' },
        { label: 'Book Appointment', key: 'appointment' },
        { label: 'Love Reading',     key: 'love' },
        { label: 'Contact Us',       key: 'contact' },
        { label: 'Vedic Astrology',  key: 'vedic' },
    ];

    function getTimestamp() {
        const now = new Date();
        const h = now.getHours(), m = now.getMinutes();
        return (h % 12 || 12) + ':' + String(m).padStart(2,'0') + ' ' + (h < 12 ? 'AM' : 'PM');
    }

    function addBotMessage(html, showQuickReplies = false) {
        const wrapper = document.createElement('div');
        wrapper.className = 'chatbot-msg-bot';
        wrapper.innerHTML = `
            <div class="cb-avatar">🔮</div>
            <div>
                <div class="cb-bubble">${html}</div>
                ${showQuickReplies ? buildQuickReplies() : ''}
                <div class="chatbot-timestamp">${getTimestamp()}</div>
            </div>`;
        msgArea.appendChild(wrapper);
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    function addUserMessage(text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'chatbot-msg-user';
        wrapper.innerHTML = `<div class="cb-bubble">${text}</div>`;
        msgArea.appendChild(wrapper);
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    function buildQuickReplies() {
        return '<div class="chatbot-quick-replies">' +
            QUICK_REPLIES.map(qr =>
                `<button class="chatbot-qr-btn" data-key="${qr.key}">${qr.label}</button>`
            ).join('') +
            '</div>';
    }

    function getBotReply(msg) {
        const lower = msg.toLowerCase();
        for (const key of Object.keys(KB)) {
            if (lower.includes(key)) return KB[key];
        }
        return `I'd love to help! Please call us at <a href="tel:+19295869234" style="color:#ff7a00">+1 929-586-9234</a> or <a href="appointment.html" style="color:#ff7a00">book an appointment</a> for personalised guidance. ✨`;
    }

    function startChat() {
        msgArea.innerHTML = '';
        addBotMessage('Hi! 🔮 How may I help you today?');
        setTimeout(() => addBotMessage('What are you looking for?', true), 600);
    }

    function sendMessage(text) {
        if (!text.trim()) return;
        addUserMessage(text);
        input.value = '';
        // Typing indicator
        const typing = document.createElement('div');
        typing.className = 'chatbot-msg-bot'; typing.id = 'typingIndicator';
        typing.innerHTML = '<div class="cb-avatar">🔮</div><div class="cb-bubble" style="color:#aab8c8;font-style:italic">Typing…</div>';
        msgArea.appendChild(typing);
        msgArea.scrollTop = msgArea.scrollHeight;
        setTimeout(() => {
            const t = document.getElementById('typingIndicator');
            if (t) t.remove();
            addBotMessage(getBotReply(text));
        }, 900);
    }

    // Event: quick reply buttons (delegated)
    msgArea.addEventListener('click', (e) => {
        const btn = e.target.closest('.chatbot-qr-btn');
        if (!btn) return;
        const key = btn.dataset.key;
        const label = btn.textContent.trim();
        // Remove quick replies panel after click
        btn.closest('.chatbot-quick-replies').remove();
        sendMessage(label);
    });

    // Event: send button & Enter key
    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(input.value); });

    // Event: toggle open/close
    toggle.addEventListener('click', () => {
        const isOpen = window_.classList.toggle('open');
        toggle.setAttribute('aria-expanded', isOpen);
    });
    closeBtn.addEventListener('click', () => {
        window_.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
    });
    refreshBtn.addEventListener('click', startChat);

    // Init
    startChat();
})();
</script>
