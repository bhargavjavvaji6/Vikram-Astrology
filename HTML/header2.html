<style>
    /* --- Premium Header Styling --- */
    .as_premium_header {
        display: flex;
        align-items: stretch;
        background-color: #092033;
        /* Dark blue background from reference */
        height: 90px;
        color: #ffffff;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 1000;
    }

    /* Logo Area */
    .as_header_logo {
        display: flex;
        align-items: center;
        padding: 0 40px;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        /* Subtle vertical divider */
    }

    .as_header_logo img {
        max-width: 180px;
        height: auto;
    }

    /* Main Content Area (Contact + Menu + Actions) */
    .as_header_content {
        display: flex;
        flex-grow: 1;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
    }

    /* Contact Info (Phone) */
    .as_header_contact {
        display: flex;
        align-items: center;
        gap: 2px;
    }

    .as_header_contact svg {
        fill: #ff7a00;
        /* Orange phone icon */
        width: 18px;
        height: 20px;
    }

    .as_header_contact h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 1px;
        color: #ffffff;
    }

    /* Navigation Menu */
    .as_header_nav ul {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 25px;
        height: 100%;
        align-items: center;
    }

    .as_header_nav li {
        display: flex;
        align-items: center;
        height: 90px;
        /* Match header height for top border alignment */
        position: relative;
    }

    .as_header_nav a {
        text-decoration: none;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .as_header_nav a:hover,
    .as_header_nav a.active {
        color: #ff7a00;
        /* Orange text on active/hover */
    }

    /* Top orange bar for the active menu item (matching reference image) */
    .as_header_nav li.active::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 3px;
        background-color: #ff7a00;
    }

    /* Action Buttons (Search & Login) */
    .as_header_actions {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .search-toggle-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
    }

    .search-toggle-btn svg {
        fill: #ff7a00;
        width: 22px;
        height: 22px;
        transition: transform 0.2s ease;
    }

    .search-toggle-btn:hover svg {
        transform: scale(1.1);
    }

    .user-login-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background-color: #17344c;
        /* Lighter blue circle */
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .user-login-btn:hover {
        background-color: #214869;
    }

    .user-login-btn svg {
        fill: #ffffff;
        width: 20px;
        height: 20px;
    }

    /* --- Search Bar Popup Overlay --- */
    .as_search_popup {
        position: absolute;
        top: 90px;
        /* Right below header */
        right: 40px;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 999;
    }

    .as_search_popup.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .as_search_popup input {
        border: 1px solid #e0e0e0;
        padding: 10px 15px;
        width: 250px;
        border-radius: 4px;
        outline: none;
        font-size: 14px;
    }

    .as_search_popup input:focus {
        border-color: #ff7a00;
    }

    .as_search_popup button {
        background: #ff7a00;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    .as_search_popup .close-search {
        background: none;
        color: #333;
        font-size: 24px;
        border: none;
        cursor: pointer;
        padding: 0 5px;
    }

    /* Responsive */
    @media (max-width: 1200px) {
        .as_header_logo {
            padding: 0 30px;
        }

        .as_header_content {
            padding: 0 20px;
        }

        .as_header_nav ul {
            gap: 15px;
        }

        .as_header_contact h2 {
            font-size: 20px;
        }
    }

    @media (max-width: 992px) {

        .as_header_nav,
        .as_header_contact {
            display: none;
        }
    }

    /* --- Dropdown Submenu Styling --- */

    /* Ensure the parent list item holds the submenu properly */
    .as_header_nav ul li {
        position: relative;
    }

    /* The hidden submenu box */
    .as_header_nav .as_submenu {
        position: absolute;
        top: 90px;
        /* Pushes it exactly below the 90px header */
        left: 0;
        background-color: #092033;
        /* Matches your premium dark blue header */
        min-width: 220px;
        padding: 10px 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(15px);
        transition: all 0.3s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        border-top: 3px solid #ff7a00;
        /* Orange top border to match active states */
        border-radius: 0 0 5px 5px;
        flex-direction: column;
        height: auto;
    }

    /* Show the submenu when hovering over "Locations" */
    .as_header_nav ul li:hover .as_submenu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* Fix the layout of the links inside the dropdown */
    .as_header_nav .as_submenu li {
        height: auto;
        width: 100%;
        display: block;
    }

    /* Remove the orange top-bar hover effect for dropdown items */
    .as_header_nav .as_submenu li::before {
        display: none;
    }

    .as_header_nav .as_submenu li a {
        display: block;
        padding: 12px 25px;
        font-size: 14px;
        color: #ffffff;
        width: 100%;
    }

    /* Dropdown hover effect */
    .as_header_nav .as_submenu li a:hover {
        background-color: #17344c;
        /* Slightly lighter blue on hover */
        color: #ff7a00;
        padding-left: 30px;
        /* Smooth indent effect on hover */
    }
</style>

<script>
    (function initHeaderSearch() {
        const openBtn = document.getElementById('openSearch');
        const closeBtn = document.getElementById('closeSearch');
        const searchPopup = document.getElementById('searchPopup');
        const searchForm = document.getElementById('headerSearchForm');
        const searchInput = document.getElementById('searchInput');
        if (openBtn) {
            openBtn.addEventListener('click', (e) => {
                e.preventDefault();
                searchPopup.classList.add('active');
                searchInput.focus();
            });
        }
        if (closeBtn) {
            closeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                searchPopup.classList.remove('active');
            });
        }
        if (searchForm) {
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();

                if (query) {
                    alert(`Searching for: "${query}"\n\n(Note: In a live environment, this would redirect to a search results page like: /search?q=${encodeURIComponent(query)})`);
                    searchPopup.classList.remove('active');
                    searchInput.value = '';
                }
            });
        }
    })();
</script>
